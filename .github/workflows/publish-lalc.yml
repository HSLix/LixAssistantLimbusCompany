name: Publish LALC

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build only, publish a Beta, or publish a stable release
        type: choice
        default: build-only
        options:
          - build-only
          - beta
          - stable

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: lalc-framework-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install build dependencies and run focused checks
        shell: pwsh
        run: |
          uv sync --locked --all-extras
          uv run --no-sync pytest -q tests/test_windows_packaging.py tests/test_framework_update.py
      - name: Download the pinned pi package and build
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.release }}
        run: |
          $buildArgs = @()
          $resourceZip = 'packaging/default-resources.zip'
          if (Test-Path -LiteralPath $resourceZip) {
            if (-not (Test-Path -LiteralPath $resourceZip -PathType Leaf)) {
              throw "Expected a ZIP file at $resourceZip."
            }
            $buildArgs += '--default-resources', $resourceZip
            if ($env:RELEASE_MODE -ne 'build-only') {
              $buildArgs += '--require-resource-version'
            }
          } elseif ($env:RELEASE_MODE -eq 'stable') {
            throw "Stable releases require $resourceZip in the release commit."
          }
          if ($env:RELEASE_MODE -eq 'beta') {
            $buildArgs += '--beta', $env:GITHUB_RUN_NUMBER
          }
          $piUrl = uv run --no-sync python -c 'from scripts.build_windows import PI_URL; print(PI_URL)'
          Invoke-WebRequest -Uri $piUrl -OutFile pi_resources/pi-windows-x64.zip
          uv run --no-sync python scripts/build_windows.py @buildArgs
      - uses: actions/upload-artifact@v4
        with:
          name: LALC-windows-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: ${{ (inputs.release == 'stable' && github.ref == 'refs/heads/master') || (inputs.release == 'beta' && github.ref_type == 'branch') }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LALC-windows-x64
          path: dist
      - name: Create a stable release draft or publish a Beta
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.release }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          previous=$(gh release view --json tagName --jq .tagName)
          (cd dist && sha256sum -c SHA256SUMS)
          release_flags=(--draft)
          extra_assets=(dist/lalc.zip)
          release_version="$version"
          if [[ $RELEASE_MODE == beta ]]; then
            release_version="$version-beta.$GITHUB_RUN_NUMBER"
            release_flags=(--prerelease --latest=false)
            extra_assets=()
          fi
          if [[ -f packaging/default-resources.zip || $RELEASE_MODE == stable ]]; then
            shopt -s nullglob
            resource_assets=(dist/default-resources-*.zip)
            if [[ ${#resource_assets[@]} != 1 ]]; then
              echo "Windows build must produce exactly one versioned default resource ZIP." >&2
              exit 1
            fi
            extra_assets+=("${resource_assets[0]}")
          fi
          {
            if [[ ! -f packaging/default-resources.zip ]]; then
              printf '%s\n' '> [!IMPORTANT]' \
                '> 此版本未内置默认资源包。运行工作流前，请另行获取并导入与此版本兼容的资源包。' '>' \
                '> This release does not include default resources. Obtain and import a compatible resource package before running workflows.' ''
            fi
            python scripts/release_notes.py "$previous" "$GITHUB_SHA"
          } > release-notes.md
          gh release create "v$release_version" --target "$GITHUB_SHA" "${release_flags[@]}" --title "LALC $release_version" \
            --notes-file release-notes.md \
            "dist/LALC-$version-windows-x64-with-agent.zip" \
            "dist/LALC-$version-windows-x64-without-agent.zip" \
            "${extra_assets[@]}" dist/SHA256SUMS

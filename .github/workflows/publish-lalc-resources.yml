name: Publish LALC Resources

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Select the Release to update
        type: choice
        required: true
        default: 指定 Release
        options:
          - 指定 Release
          - 最新正式版
          - 最新 Beta
      target_release:
        description: Existing tag for 指定 Release only (for example v6.0.0-beta.5)
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: lalc-framework-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ inputs.release_target }}
      TARGET_RELEASE: ${{ inputs.target_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Verify and append default resources
        id: resources
        run: |
          uv run --locked --no-default-groups python - <<'PY'
          import os
          from pathlib import Path

          from lalc.resource_version import read_resource_version
          from scripts.publish_default_resources import publish, resolve_release_tag

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = resolve_release_tag(repo, os.environ["TARGET_RELEASE"], os.environ["RELEASE_TARGET"])
          publish(repo, tag)
          version = read_resource_version(Path("packaging/default-resources.zip"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", f"version={version}", sep="\n", file=output)
          PY
      - name: Trigger MirrorChyanResourcesUploading
        env:
          RESOURCE_TAG: ${{ steps.resources.outputs.tag }}
          RESOURCE_VERSION: ${{ steps.resources.outputs.version }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan-resources.yml \
            -f tag="$RESOURCE_TAG" -f version="$RESOURCE_VERSION"

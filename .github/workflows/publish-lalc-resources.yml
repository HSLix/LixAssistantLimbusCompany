name: Publish LALC Resources

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Select the Release to update
        type: choice
        required: true
        default: 指定 Release
        options:
          - 指定 Release
          - 最新正式版
          - 最新 Beta
      target_release:
        description: Existing tag for 指定 Release only (for example v6.0.0-beta.5)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: lalc-framework-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ inputs.release_target }}
      TARGET_RELEASE: ${{ inputs.target_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Verify and append default resources
        run: uv run --locked --no-default-groups python scripts/publish_default_resources.py "$GITHUB_REPOSITORY" "$TARGET_RELEASE" "$RELEASE_TARGET"
